id: representation
version: 0.1.0
title: Unsupervised representation
description: Unsupervised representation with training-only fitting and one final
  test exposure.
brief_questions:
- id: aim
  text: What should this unsupervised study investigate?
- id: unit
  text: What is one row (patient, sample, visit)? Can a subject have several rows?
events:
- onboard
- data
- eda
- split
- preprocess
- features
- model
- validate
- test
- interpret
- report
transitions:
  loops:
  - from: validate
    to:
    - preprocess
    - features
    - model
  goto: []
style: default
default_runtime_packages:
- numpy
- pandas
- scipy
- scikit-learn
- matplotlib
- seaborn
- pyarrow
