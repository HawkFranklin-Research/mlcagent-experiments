id: freeze_time
event: split
title: Freeze time-ordered partitions
params:
  method:
    type: enum
    enum:
    - stratified
    - random
    - group
    - time
    default: time
  train_fraction:
    type: number
    default: 0.6
    minimum: 0.1
    maximum: 0.9
  val_fraction:
    type: number
    default: 0.2
    minimum: 0.05
    maximum: 0.8
  seed:
    type: integer
    default: 42
  group_column:
    type: string
    default: ''
    required: false
  time_column:
    type: string
    default: ''
    required: false
prompt: 'Do: engine time-ordered split using the inferred time column.

  Save: split.json.'
inputs:
- ref: registered_data
outputs:
- name: split.json
  kind: report
  required: true
fact_candidates: []
reads_test: false
timeout_s: 300
methods_text: Follow the recorded task and saved model contract; all fitting uses
  training rows only.
builtin: split
