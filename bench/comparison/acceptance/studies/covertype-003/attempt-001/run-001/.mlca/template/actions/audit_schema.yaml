# Content v0.2.0 (2026-10-06). Keep it short: see docs/templates.md, 'Writing content'.
id: audit_schema
event: data
title: Audit columns, types and missingness
params: {}
prompt: |
  Do: one row per column: name, dtype, n_unique, n_missing, pct_missing.
  Save: schema.json (that table).
  Record: facts n_rows, n_columns, missing.total (source schema.json).
inputs:
- ref: registered_data
outputs:
- name: schema.json
  kind: table
  required: true
fact_candidates:
- n_rows
- n_columns
- missing.total
reads_test: false
timeout_s: 300
methods_text: Column types, unique values and missingness were audited on the registered table.
builtin: null
