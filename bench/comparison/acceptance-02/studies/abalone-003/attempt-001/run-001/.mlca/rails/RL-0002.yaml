text: 'Choose problem_type from the schema. Two observed values in the outcome: binary. Three
  or more discrete labels: multiclass. Several categorical outcome columns describing the
  same row at different levels of detail: multilabel, with all of them as targets. This holds when
  each coarser level is determined by a finer one: they are joint outcomes, so do not keep only the finest
  level and list the coarser levels as leakage suspects. One numeric
  measurement or count: regression. Two or more numeric outcomes recorded together: multioutput_regression.
  If no column is a plausible outcome, choose clustering when rows are entities or events
  to segment, and representation when the table is many homogeneous numeric features of one
  kind. Prefer the task the table was evidently assembled for over an incidental column.'
reason: Setup proposals chose a binary outcome as multiclass and a multi-output outcome set
  as a single target; the problem type decides every later step.
