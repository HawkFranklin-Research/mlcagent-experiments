id: score_test
event: test
title: Score the frozen model on test rows
params: {}
prompt: 'Do: Compute Silhouette, Calinski-Harabasz and Davies-Bouldin with saved candidates. Reuse
  training stability computed during Model; never refit resamples here. No labels exist in this project.
  Score only test; do not fit. Freeze the validation-selected candidate before test.

  Save: test_metrics.csv (model, metric, value).

  Record: the exact declared metric _protocol[''task''][''primary_metric''] on test; fact test_score
  (source test_metrics.csv).

  Save: assignments.parquet, one row per training and test source row; row_id = original DataFrame
  index, partition = train/test, and cluster assignment. Use save_row_outputs. These are local-only
  evaluator artifacts; never expose them to an LLM. Read the declared metric from _protocol[''task''][''primary_metric''];
  compute and record that exact name, not a template default. Other listed metrics are supplementary.
  Use its correct optimization direction and compare candidates only on validation; test scores never
  select a model.'
inputs:
- ref: train
- ref: val
- ref: prior_outputs
- ref: test
outputs:
- name: test_metrics.csv
  kind: table
  required: true
- name: assignments.parquet
  kind: data
  row_partitions:
  - train
  - test
  required: true
fact_candidates:
- test_score
reads_test: true
timeout_s: 300
methods_text: 'Score the frozen model on test rows: Score the frozen candidates using the task-specific
  declared primary metric and its direction; supplementary metrics do not replace it. Fit only on
  training rows, select on validation, and evaluate the frozen choice on test.'
builtin: null
