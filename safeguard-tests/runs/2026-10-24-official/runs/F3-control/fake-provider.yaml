- match:
    role: worker
    action_id: audit_schema
  text: "```python\nimport json, pandas as pd, mlca_runtime as m\ni=m.inputs(); path=next(v\
    \ for k,v in i.items() if k != \"_protocol\")\ndf=pd.read_csv(path)\nschema=pd.DataFrame({\"\
    name\":df.columns.astype(str),\"dtype\":df.dtypes.astype(str),\n \"n_unique\"\
    :[int(df[c].nunique(dropna=True)) for c in df],\n \"n_missing\":[int(df[c].isna().sum())\
    \ for c in df]})\nschema[\"pct_missing\"]=schema[\"n_missing\"] / max(len(df),1)\
    \ * 100\nm.save_table(schema,\"schema.json\")\nm.record_fact_candidate(\"n_rows\"\
    ,int(len(df)),source=\"schema.json\")\nm.record_fact_candidate(\"n_columns\",int(df.shape[1]),source=\"\
    schema.json\")\nm.record_fact_candidate(\"missing.total\",int(df.isna().sum().sum()),source=\"\
    schema.json\")\n\n```"
- match:
    role: worker
    action_id: audit_test
  text: "```python\nimport json, pickle, numpy as np, pandas as pd, mlca_runtime as\
    \ m\ni=m.inputs(); p=json.loads(i[\"_protocol\"].read_text()); df=pd.read_parquet(i['test']);\
    \ targets=p[\"targets\"]\ndrop=set(targets)|set(p.get(\"excluded_columns\",[]))|set([])|set(p[\"\
    task\"].get(\"time_columns\",[]))|({p[\"group_column\"]} if p.get(\"group_column\"\
    ) else set())\nmodel=pickle.load(open(i[\"latest_model\"],\"rb\")); names=getattr(model,\"\
    feature_names_in_\",None)\nX=df[list(names)] if names is not None else df.drop(columns=[c\
    \ for c in drop if c in df])\nfrom sklearn.metrics import roc_auc_score\nproba=model.predict_proba(X);\
    \ classes=list(model.classes_); positive=1 if 1 in classes else classes[-1]; j=classes.index(positive)\n\
    pred=model.predict(X); value=float(roc_auc_score(df[targets[0]],proba[:,j]))\n\
    metric=p[\"task\"].get(\"primary_metric\") or 'roc_auc'; m.record_metric(metric,value,'test')\n\
    m.save_table(pd.DataFrame({\"metric\":[metric],\"value\":[value]}),'test_predictions.parquet')\n\
    m.save_row_outputs(pd.DataFrame({\"row_id\":df.index,\"partition\":\"test\",\"\
    y_true\":df[targets[0]].to_numpy(),\"y_pred\":pred,\n **{f\"proba__{c}\":proba[:,j]\
    \ for j,c in enumerate(classes)}}),'test_predictions.parquet')\n\n```"
