  text: "```python\nimport json, pandas as pd, numpy as np, mlca_runtime as m\ni=m.inputs();\
    \ p=json.loads(i[\"_protocol\"].read_text()); path=next(v for k,v in i.items()\
    \ if k != \"_protocol\")\ndf=pd.read_csv(path); numeric=df.select_dtypes(include=\"\
    number\"); categorical=df.select_dtypes(exclude=\"number\"); rows=[]\nfor c in\
    \ numeric:\n s=numeric[c]; rows.append({\"column\":c,\"kind\":\"numeric\",\"mean\"\
    :s.mean(),\"sd\":s.std(),\"min\":s.min(),\"median\":s.median(),\"max\":s.max(),\"\
    n_missing\":int(s.isna().sum())})\nfor c in categorical:\n s=categorical[c]; counts=s.value_counts(normalize=True,dropna=True);\
    \ rows.append({\"column\":c,\"kind\":\"categorical\",\"n_levels\":int(s.nunique(dropna=True)),\"\
    top_level_share\":float(counts.iloc[0]) if len(counts) else np.nan,\"n_missing\"\
    :int(s.isna().sum())})\nm.save_table(pd.DataFrame(rows),\"distributions.csv\"\
    )\nm.record_fact_candidate(\"n_numeric\",int(len(numeric.columns)),source=\"distributions.csv\"\
    )\nm.record_fact_candidate(\"n_categorical\",int(len(categorical.columns)),source=\"\
    distributions.csv\")\n\n```"
- match:
    role: worker
    action_id: explain_model
  text: '```python

    import json, pickle, pandas as pd, mlca_runtime as m

    i=m.inputs(); model=pickle.load(open(i["latest_model"],"rb")); final=model[-1]
    if hasattr(model,"steps") else model

    names=list(getattr(final,"feature_names_in_",[])); values=getattr(final,"coef_",getattr(final,"feature_importances_",[]))

    import numpy as np

    values=np.asarray(values); values=np.abs(values[0]) if values.ndim>1 else np.abs(values)

    if len(names)!=len(values): names=[f"feature_{j}" for j in range(len(values))]

    m.save_table(pd.DataFrame({"feature":names,"importance_mean":values,"importance_sd":np.zeros(len(values))}).head(15),''interpretation.csv'')


    ```'
- match:
    role: worker
    action_id: fit_preprocessing
  text: '```python

    import json, pandas as pd, mlca_runtime as m

    from sklearn.compose import ColumnTransformer

    from sklearn.impute import SimpleImputer

    from sklearn.pipeline import make_pipeline

    from sklearn.preprocessing import OneHotEncoder, StandardScaler

    i=m.inputs(); p=json.loads(i["_protocol"].read_text()); tr=pd.read_parquet(i["train"])

    drop=set(p["targets"])|set(p.get("excluded_columns",[]))|set([])|set(p["task"].get("time_columns",[]))|({p["group_column"]}
    if p.get("group_column") else set())

    X=tr.drop(columns=[c for c in drop if c in tr]); nums=X.select_dtypes(include="number").columns.tolist();
    cats=[c for c in X if c not in nums]

    parts=[]

    if nums: parts.append(("numeric",make_pipeline(SimpleImputer(strategy="median"),StandardScaler()),nums))

    if cats: parts.append(("categorical",make_pipeline(SimpleImputer(strategy="most_frequent"),OneHotEncoder(handle_unknown="ignore")),cats))

    obj=ColumnTransformer(parts); fitted=m.fit_record(obj,X,"train"); m.save_model(fitted,"preprocessor.pkl")


    ```'
