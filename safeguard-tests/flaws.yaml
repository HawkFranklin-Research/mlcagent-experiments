  - id: F3
    table: synthetic
    template: tabular_classification
    brief: {aim: Predict y from the synthetic measurements, target: y, unit: one synthetic row}
    setup: {excluded_columns: [], group_column: null, time_columns: []}
    action: select_features
    flaw_description: Select features on combined training and validation rows before cross-validation.
    planted_script: |
      import pandas as pd, mlca_runtime as m
      from sklearn.feature_selection import SelectKBest, f_classif
      i=m.inputs(); tr=pd.read_parquet(i['train']); va=pd.read_parquet(i['val'])
      both=pd.concat([tr,va]); X=both.drop(columns='y'); y=both['y']
      sel=m.fit_record(SelectKBest(f_classif,k=2),X,'train',y=y); m.save_model(sel,'selector.pkl')
    control_script: |
      import pandas as pd, mlca_runtime as m
      from sklearn.feature_selection import SelectKBest, f_classif
      tr=pd.read_parquet(m.inputs()['train']); X=tr.drop(columns='y')
      sel=m.fit_record(SelectKBest(f_classif,k=2),X,'train',y=tr['y']); m.save_model(sel,'selector.pkl')
  - id: F4a
    table: heart_disease_cleveland
    template: tabular_classification
    brief: {aim: Predict the binary heart disease outcome, target: heart_disease_binary, unit: one patient record}
    setup: {excluded_columns: [num], group_column: null, time_columns: []}
    action: train_logistic
    flaw_description: Use the declared target-derived source column num as a model input.
    planted_script: |
      import pandas as pd, mlca_runtime as m, json
      from sklearn.linear_model import LogisticRegression
      from sklearn.pipeline import make_pipeline
      from sklearn.impute import SimpleImputer
      i=m.inputs(); p=json.load(open(i['_protocol'])); tr=pd.read_parquet(i['train']); y=p['targets'][0]
      X=tr.drop(columns=[y]); model=m.fit_record(make_pipeline(SimpleImputer(strategy='median'),LogisticRegression(max_iter=1000)),X,'train',y=tr[y]); m.save_model(model,'model.pkl')
    control_script: |
      import pandas as pd, mlca_runtime as m, json
      from sklearn.linear_model import LogisticRegression
      from sklearn.pipeline import make_pipeline
      from sklearn.impute import SimpleImputer
      i=m.inputs(); p=json.load(open(i['_protocol'])); tr=pd.read_parquet(i['train']); y=p['targets'][0]
      X=tr.drop(columns=[y,'num']); model=m.fit_record(make_pipeline(SimpleImputer(strategy='median'),LogisticRegression(max_iter=1000)),X,'train',y=tr[y]); m.save_model(model,'model.pkl')
