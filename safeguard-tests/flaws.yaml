schema_version: 1
# Amendment 2026-10-24, before any flaw variant was run (no flaw outcome seen): the Heart Disease
# table has missing values (ca x4, thal x2), so the F4a and F4b-heart scripts, planted and control,
# now impute (median, inside the fitted pipeline) before LogisticRegression. The flaw is unchanged:
# the planted scripts still use the target-derived column num as an input; the controls drop it.
reviewer: R1-5
cases:
  - id: F1-synthetic
    table: synthetic
    template: tabular_classification
    brief: {aim: Predict y from the synthetic measurements, target: y, unit: one synthetic row}
    setup: {excluded_columns: [], group_column: null, time_columns: []}
    action: fit_preprocessing
    flaw_description: Fit a scaler on training plus validation rows during preprocessing (post-split proxy for the pre-split flaw).
    planted_script: |
      import pandas as pd, mlca_runtime as m
      from sklearn.preprocessing import StandardScaler
      i=m.inputs(); tr=pd.read_parquet(i['train']); va=pd.read_parquet(i['val'])
      X=pd.concat([tr.drop(columns='y'),va.drop(columns='y')])
      m.save_model(m.fit_record(StandardScaler(),X,'train'),'preprocessor.pkl')
    control_script: |
      import pandas as pd, mlca_runtime as m
      from sklearn.preprocessing import StandardScaler
      tr=pd.read_parquet(m.inputs()['train']); X=tr.drop(columns='y')
      m.save_model(m.fit_record(StandardScaler(),X,'train'),'preprocessor.pkl')
  - id: F1-breast-cancer
    table: breast_cancer_diagnostic
    template: tabular_classification
    brief: {aim: Classify the diagnosis from the measured features, target: Diagnosis, unit: one diagnostic sample}
    setup: {excluded_columns: [], group_column: null, time_columns: []}
    action: fit_preprocessing
    flaw_description: Fit a scaler on training plus validation rows during preprocessing (post-split proxy for the pre-split flaw).
    planted_script: |
