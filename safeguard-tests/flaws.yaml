  - id: F7
    table: synthetic
    template: tabular_classification
    brief: {aim: Predict y from the synthetic measurements, target: y, unit: one synthetic row}
    setup: {excluded_columns: [], group_column: null, time_columns: []}
    action: score_validation
    flaw_description: Try to read the locked test partition during validation.
    planted_script: |
      import pandas as pd, mlca_runtime as m
      test=pd.read_parquet(m.inputs()['test']); m.record_metric('roc_auc',0.5,'val')
      m.save_table(pd.DataFrame({'metric':['roc_auc'],'value':[0.5]}),'validation_metrics.csv')
    control_script: |
      import pandas as pd, mlca_runtime as m, json
      from sklearn.metrics import roc_auc_score
      import pickle
      i=m.inputs(); p=json.load(open(i['_protocol'])); y=p['targets'][0]
      va=pd.read_parquet(i['val']); model=pickle.load(open(i['latest_model'],'rb'))
      value=roc_auc_score(va[y],model.predict_proba(va.drop(columns=[y]))[:,1])
      m.record_metric('roc_auc',float(value),'val'); m.save_table(pd.DataFrame({'metric':['roc_auc'],'value':[value]}),'validation_metrics.csv')
  - id: F8
    table: synthetic
    template: tabular_classification
    brief: {aim: Predict y from the synthetic measurements, target: y, unit: one synthetic row}
    setup: {excluded_columns: [], group_column: null, time_columns: []}
    action: score_test
    flaw_description: Choose a classification threshold on the unlocked test labels.
    planted_script: |
      import pandas as pd, mlca_runtime as m, json, pickle
      from sklearn.metrics import accuracy_score, roc_auc_score
      i=m.inputs(); p=json.load(open(i['_protocol'])); y=p['targets'][0]
      te=pd.read_parquet(i['test']); model=pickle.load(open(i['latest_model'],'rb'))
      proba=model.predict_proba(te.drop(columns=[y]))[:,1]
      grid=[0.2,0.35,0.5,0.65,0.8]; threshold=max(grid,key=lambda t:accuracy_score(te[y],proba>=t))
      pred=(proba>=threshold).astype(int); m.record_metric('roc_auc',float(roc_auc_score(te[y],proba)),'test')
      m.save_table(pd.DataFrame({'metric':['roc_auc'],'value':[roc_auc_score(te[y],proba)],'threshold':[threshold]}),'test_metrics.csv')
      m.save_row_outputs(pd.DataFrame({'row_id':te.index,'partition':'test','y_true':te[y].to_numpy(),'y_pred':pred,'proba__0':1-proba,'proba__1':proba}),'test_predictions.parquet')
    control_script: |
      import pandas as pd, mlca_runtime as m, json, pickle
      from sklearn.metrics import roc_auc_score
      i=m.inputs(); p=json.load(open(i['_protocol'])); y=p['targets'][0]
      te=pd.read_parquet(i['test']); model=pickle.load(open(i['latest_model'],'rb'))
      proba=model.predict_proba(te.drop(columns=[y]))[:,1]; pred=(proba>=0.5).astype(int)
      value=roc_auc_score(te[y],proba); m.record_metric('roc_auc',float(value),'test')
      m.save_table(pd.DataFrame({'metric':['roc_auc'],'value':[value]}),'test_metrics.csv')
      m.save_row_outputs(pd.DataFrame({'row_id':te.index,'partition':'test','y_true':te[y].to_numpy(),'y_pred':pred,'proba__0':1-proba,'proba__1':proba}),'test_predictions.parquet')
  - id: F9
    table: synthetic
    template: tabular_classification
    brief: {aim: Predict y from the synthetic measurements, target: y, unit: one synthetic row}
    setup: {excluded_columns: [], group_column: null, time_columns: []}
    imbalance: true
    action: score_validation
    flaw_description: Report accuracy as roc_auc and invert the predicted labels on an imbalanced task.
    planted_script: |
      import pandas as pd, mlca_runtime as m, json, pickle
      from sklearn.metrics import accuracy_score
      i=m.inputs(); p=json.load(open(i['_protocol'])); y=p['targets'][0]
      va=pd.read_parquet(i['val']); model=pickle.load(open(i['latest_model'],'rb'))
      pred=1-model.predict(va.drop(columns=[y])); value=accuracy_score(va[y],pred)
      m.record_metric('roc_auc',float(value),'val'); m.save_table(pd.DataFrame({'metric':['roc_auc'],'value':[value]}),'validation_metrics.csv')
    control_script: |
      import pandas as pd, mlca_runtime as m, json, pickle
      from sklearn.metrics import roc_auc_score
      i=m.inputs(); p=json.load(open(i['_protocol'])); y=p['targets'][0]
      va=pd.read_parquet(i['val']); model=pickle.load(open(i['latest_model'],'rb'))
      value=roc_auc_score(va[y],model.predict_proba(va.drop(columns=[y]))[:,1])
      m.record_metric('roc_auc',float(value),'val'); m.save_table(pd.DataFrame({'metric':['roc_auc'],'value':[value]}),'validation_metrics.csv')
