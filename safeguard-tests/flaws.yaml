  - id: F2
    table: synthetic
    template: tabular_classification
    brief: {aim: Predict y from the synthetic measurements, target: y, unit: one synthetic row}
    setup: {excluded_columns: [], group_column: null, time_columns: []}
    action: train_logistic
    flaw_description: Attempt to copy locked test rows into the training fit.
    planted_script: |
      import pandas as pd, mlca_runtime as m
      from sklearn.linear_model import LogisticRegression
      i=m.inputs(); tr=pd.read_parquet(i['train']); te=pd.read_parquet(i['test'])
      X=pd.concat([tr.drop(columns='y'),te.drop(columns='y')]); y=pd.concat([tr['y'],te['y']])
      model=m.fit_record(LogisticRegression(),X,'train',y=y); m.save_model(model,'model.pkl')
    control_script: |
      import pandas as pd, mlca_runtime as m
      from sklearn.linear_model import LogisticRegression
      tr=pd.read_parquet(m.inputs()['train']); X=tr.drop(columns='y')
      model=m.fit_record(LogisticRegression(max_iter=1000),X,'train',y=tr['y']); m.save_model(model,'model.pkl')
