id: score_validation
event: validate
title: Score candidates on validation rows
params: {}
prompt: "Do: for each saved candidate: Harrell's C-index; check proportional hazards (Schoenfeld\
  \ test, p per covariate) for the baseline.\nSave: validation_metrics.csv (model, metric, value).\n\
  Record: the exact declared metric _protocol['task']['primary_metric'] on val for each model; facts\
  \ best_model, best_val_c_index (source validation_metrics.csv).\n Read the declared metric from\
  \ _protocol['task']['primary_metric']; compute and record that exact name, not a template default.\
  \ Other listed metrics are supplementary. Use its correct optimization direction and compare candidates\
  \ only on validation; test scores never select a model."
inputs:
- ref: train
- ref: val
- ref: prior_outputs
outputs:
- name: validation_metrics.csv
  kind: table
  required: true
fact_candidates:
- best_model
- best_val_c_index
reads_test: false
timeout_s: 300
methods_text: 'Score candidates on validation rows: Score the frozen candidates using the task-specific
  declared primary metric and its direction; supplementary metrics do not replace it. Fit only on
  training rows, select on validation, and evaluate the frozen choice on test.'
builtin: null
